# Cauldron: nginx site config. See deploy/DEPLOY.md.
# Replace cauldron.example.com with your domain, then: sudo certbot --nginx -d cauldron.example.com
# The website is the static build in dist/; /api goes to the bot on 127.0.0.1:5015.

server {
    listen 80;
    listen [::]:80;
    server_name cauldron.example.com;

    root /home/cauldron/cauldron-brew/dist;
    index index.html;

    # the bot's API (status for the site, admin for /memex)
    location /api/ {
        proxy_pass http://127.0.0.1:5015;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # hashed build files: cache for a long time
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # single-page app: /memex and every other route serve index.html (never cached)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
